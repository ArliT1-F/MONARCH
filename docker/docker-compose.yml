# ── Read this first: where Compose looks for `.env` ───────────────────────────
# Compose interpolates ${VAR} from a `.env` in the *project directory*, which
# defaults to the folder holding this file — `docker/`, not the repo root. Run
# it from the root without `--env-file` and every value below expands to empty:
# the bot logs "DISCORD_BOT_TOKEN is not set — bot not started." and exits 0, so
# you get a container that looks fine and a bot that is simply never online.
#
#   docker compose --env-file .env -f docker/docker-compose.yml up -d lavalink
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --no-deps bot
#
# Equivalently `ln -s ../.env docker/.env` (`.env` is gitignored either way), or
# `cd docker && docker compose --env-file ../.env up -d`. The systemd units that
# deploy/laptop-install.sh writes read the repo's .env directly through
# EnvironmentFile=, which is why they have no such trap.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monarch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monarch}
      POSTGRES_DB: monarch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monarch"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    # One-shot: apply Prisma migrations before the dashboard boots.
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
      DIRECT_DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: make the plugins volume writable by the node.
  #
  # ghcr.io/lavalink-devs/lavalink:4 runs as uid/gid 322 and chowns
  # /opt/Lavalink during the build — but /opt/Lavalink/plugins does not exist in
  # the image, so Docker creates that mount point *root-owned* (fresh named
  # volume or bind mount, same result). The JVM then cannot write the plugin
  # jars it downloads, PluginManager throws
  #
  #   java.io.FileNotFoundException: ./plugins/youtube-plugin-<ver>.jar (Permission denied)
  #
  # and the node crash-loops on `restart: unless-stopped` without ever printing
  # "Lavalink is ready to accept connections" — so /music reports the backend is
  # down while every other command keeps working. This job is idempotent, exits
  # 0, and is what lets a first `up -d lavalink` succeed on a clean machine.
  # Already stuck in the loop? Fix the existing volume without recreating it:
  #   docker run --rm --volumes-from monarch-lavalink busybox \
  #     chown -R 322:322 /opt/Lavalink/plugins && docker restart monarch-lavalink
  lavalink-perms:
    image: busybox:1.36
    container_name: monarch-lavalink-perms
    restart: "no"
    command: sh -c "mkdir -p /opt/Lavalink/plugins && chown -R 322:322 /opt/Lavalink/plugins && ls -ld /opt/Lavalink/plugins"
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins

  # The music backend. A Lavalink node is a JVM process that holds the Discord
  # voice socket, decodes audio, encodes Opus and does the YouTube/SoundCloud/
  # Bandcamp fetching — the bot only tells it what to play over websocket+REST.
  # That split is why this service exists at all: the bot image needs no ffmpeg,
  # no yt-dlp and no UDP egress, and a container that cannot pass UDP (Render)
  # can still run /music against a node hosted somewhere that can.
  #
  # First boot downloads the youtube-source plugin declared in application.yml,
  # so give it a few seconds; the bot reconnects on its own until it answers.
  #
  # Its only dependency is `lavalink-perms` above, so `up -d lavalink` brings up
  # exactly those two — no dashboard, no Postgres, no `--no-deps` needed.
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: monarch-lavalink
    restart: unless-stopped
    depends_on:
      lavalink-perms:
        condition: service_completed_successfully
    environment:
      # Heap ceiling for the JVM. 1 G is generous for a handful of guilds.
      _JAVA_OPTIONS: -Xmx1G
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      LAVALINK_PORT: 2333
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      # Named volume, not a host bind mount: the jars should not land in the
      # working tree, and a bind mount is root-owned on creation too. Neither is
      # writable by the node's uid 322 on its own — hence `lavalink-perms`.
      - lavalink-plugins:/opt/Lavalink/plugins
    # Published only so you can poke it from the host (`curl localhost:2333/version`).
    # The bot reaches it over the compose network as ws://lavalink:2333 —
    # drop the ports mapping if this box is on an untrusted network.
    ports:
      - "${LAVALINK_PORT:-2333}:2333"

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    environment:
      DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      APP_URL: ${APP_URL:-http://localhost:3000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      # Your own Discord user id: targeting it with /burg uno-reverses onto
      # the invoker instead. Without it the owner can be burg'd like anyone
      # else (the worker logs a warning at boot).
      MONARCH_OWNER_USER_ID: ${MONARCH_OWNER_USER_ID:-}

      # The node from the service above. Point LAVALINK_NODES at your own
      # (comma-separated list, `[name@][ws|wss://]host[:port]`) to run the
      # music backend elsewhere — or list several and the bot picks the
      # least-loaded reachable one per guild.
      LAVALINK_NODES: ${LAVALINK_NODES:-ws://lavalink:2333}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}

      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      MUSIC_DJ_ROLE_NAMES: ${MUSIC_DJ_ROLE_NAMES:-dj}
      MUSIC_STAFF_ROLE_NAMES: ${MUSIC_STAFF_ROLE_NAMES:-moderator,moderators,mod,mods,staff,admin,admins,administrator,administrators}
    depends_on:
      - dashboard
      - lavalink

volumes:
  pgdata:
  lavalink-plugins:
