# ── Where Compose looks for `.env` ────────────────────────────────────────────
# ${VAR} below interpolates from a `.env` in the *project directory* — the folder
# holding this file (`docker/`), not the repo root. Without it every value
# expands to empty and the bot logs "DISCORD_BOT_TOKEN is not set — bot not
# started." and exits 0: a healthy-looking container and a worker that is never
# online, so no command answers. The node silently falls back to
# `youshallnotpass` the same way, and then refuses a systemd bot's real
# LAVALINK_PASSWORD with a 401.
#
#   docker compose --env-file .env -f docker/docker-compose.yml up -d lavalink
#   docker compose --env-file .env -f docker/docker-compose.yml up -d --no-deps bot
#
# Or `ln -s ../.env docker/.env` once (gitignored either way). The units that
# deploy/laptop-install.sh writes read the repo's .env through EnvironmentFile=
# and have no such trap — see docs/hosting-laptop.md.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monarch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monarch}
      POSTGRES_DB: monarch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monarch"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    # One-shot: apply Prisma migrations before the dashboard boots.
    command: sh -c "npx prisma migrate deploy"
    environment:
      DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
      DIRECT_DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot: make the plugins volume writable by the Lavalink node.
  lavalink-perms:
    image: busybox:1.36
    container_name: monarch-lavalink-perms
    restart: "no"
    command: sh -c "mkdir -p /opt/Lavalink/plugins && chown -R 322:322 /opt/Lavalink/plugins && ls -ld /opt/Lavalink/plugins"
    volumes:
      - lavalink-plugins:/opt/Lavalink/plugins

  # Music backend.
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: monarch-lavalink
    restart: unless-stopped
    depends_on:
      lavalink-perms:
        condition: service_completed_successfully
    environment:
      # Heap ceiling for the JVM.
      _JAVA_OPTIONS: -Xmx1G
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}
      LAVALINK_PORT: 2333
      # Spotify credentials for the LavaSrc plugin (same vars the bot uses).
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    ports:
      - "${LAVALINK_PORT:-2333}:2333"

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    environment:
      DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      APP_URL: ${APP_URL:-http://localhost:3000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      MONARCH_OWNER_USER_ID: ${MONARCH_OWNER_USER_ID:-}

      # Lavalink node.
      LAVALINK_NODES: ${LAVALINK_NODES:-ws://lavalink:2333}
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-youshallnotpass}

      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      MUSIC_DJ_ROLE_NAMES: ${MUSIC_DJ_ROLE_NAMES:-dj}
      MUSIC_STAFF_ROLE_NAMES: ${MUSIC_STAFF_ROLE_NAMES:-moderator,moderators,mod,mods,staff,admin,admins,administrator,administrators}
    depends_on:
      - dashboard
      - lavalink

volumes:
  pgdata:
  lavalink-plugins:
