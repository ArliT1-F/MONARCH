# ── Where Compose looks for `.env` ────────────────────────────────────────────
# Compose interpolates ${VAR} from a `.env` in the *project directory* — the
# folder holding this file (`docker/`), not the repo root. To make both
# locations work, every service below declares `env_file: [../.env, .env]`
# (`required: false`, so a fresh clone without a `.env` still starts):
#
#   docker compose -f docker/docker-compose.yml up -d            # repo root
#   cd docker && docker compose up -d                            # inside docker/
#
# Explicit `--env-file` still wins if you pass it:
#   docker compose --env-file .env -f docker/docker-compose.yml up -d
#
# Or `ln -s ../.env docker/.env` once (gitignored either way). The units that
# deploy/laptop-install.sh writes read the repo's .env through EnvironmentFile=
# and have no such trap — see docs/hosting-laptop.md.

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      POSTGRES_USER: monarch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monarch}
      POSTGRES_DB: monarch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monarch"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    # One-shot: apply Prisma migrations before the dashboard boots.
    command: sh -c "npx prisma migrate deploy"
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
      DIRECT_DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:-monarch}@postgres:5432/monarch
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      APP_URL: ${APP_URL:-http://localhost:3000}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      MONARCH_OWNER_USER_ID: ${MONARCH_OWNER_USER_ID:-}

      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      MUSIC_DJ_ROLE_NAMES: ${MUSIC_DJ_ROLE_NAMES:-dj}
      MUSIC_STAFF_ROLE_NAMES: ${MUSIC_STAFF_ROLE_NAMES:-moderator,moderators,mod,mods,staff,admin,admins,administrator,administrators}
    depends_on:
      - dashboard

volumes:
  pgdata:
