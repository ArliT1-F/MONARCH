# Production deployment (HTTPS public dashboard, PostgreSQL, one bot worker).
# env_file loads container variables; it does NOT provide Compose interpolation.
# Always pass the repo-root file explicitly:
#   docker compose --env-file .env -f docker/docker-compose.yml up --build -d
# Missing required secrets fail configuration; there are no shared DB defaults.
# See docs/security.md for reverse-proxy/TLS and local-development requirements.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: monarch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: monarch
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U monarch"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    # One-shot: apply Prisma migrations before the dashboard boots.
    command: sh -c "npx prisma migrate deploy"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/monarch
      DIRECT_DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/monarch
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/dashboard.Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://monarch:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/monarch
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS dashboard origin}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  bot:
    build:
      context: ..
      dockerfile: docker/bot.Dockerfile
    env_file:
      - path: ../.env
        required: false
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
      APP_URL: ${APP_URL:?Set APP_URL to the public HTTPS dashboard origin}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?Set INTERNAL_API_TOKEN}
      DASHBOARD_INTERNAL_URL: ${DASHBOARD_INTERNAL_URL:-http://dashboard:3000}
      MONARCH_OWNER_USER_ID: ${MONARCH_OWNER_USER_ID:-}

      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:-}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:-}
      MUSIC_DJ_ROLE_NAMES: ${MUSIC_DJ_ROLE_NAMES:-dj}
      MUSIC_STAFF_ROLE_NAMES: ${MUSIC_STAFF_ROLE_NAMES:-moderator,moderators,mod,mods,staff,admin,admins,administrator,administrators}
    depends_on:
      - dashboard

volumes:
  pgdata:
