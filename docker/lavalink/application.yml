# ── Lavalink server config for Monarch ──────────────────────────────────────
# One file, two homes:
#   • docker-compose mounts it read-only at /opt/Lavalink/application.yml
#     (service `lavalink` in docker/docker-compose.yml)
#   • deploy/laptop-install.sh copies it next to Lavalink.jar for the
#     monarch-lavalink.service systemd user unit
#
# Every value below can be overridden by an environment variable of the same
# name (${VAR:default} is Spring's syntax, and Lavalink is a Spring Boot app),
# which is how LAVALINK_PASSWORD keeps the bot and this node in agreement
# without editing two files.
#
# The bot talks to this node over a websocket plus REST — see
# apps/bot/src/music/lavalink.ts. It never shells out to yt-dlp or ffmpeg:
# decoding, Opus encoding and the Discord voice socket all happen in here.

server: # REST and WS server
  port: ${LAVALINK_PORT:2333}
  address: 0.0.0.0 # 0.0.0.0 so the bot reaches it from another container

lavalink:
  plugins:
    # YouTube is not built into Lavalink 4 — this plugin is the supported
    # source manager (https://github.com/lavalink-devs/youtube-source). It
    # fans out over several InnerTube clients and retries the next one when
    # YouTube throttles or refuses a request, which is exactly the failure
    # mode that used to cut tracks short mid-song.
    # Downloaded into pluginsDir on first boot; that directory needs to stay
    # writable and is worth keeping across restarts (compose uses a volume).
    - dependency: "dev.lavalink.youtube:youtube-plugin:${YOUTUBE_PLUGIN_VERSION:1.18.2}"
      snapshot: false
    # LavaSrc adds Spotify, Apple Music, Deezer etc. as first-class sources.
    # The bot already resolves Spotify links via its own Web API client, but
    # having LavaSrc on the node means the node can also resolve spsearch:
    # queries and Spotify URLs directly, bypassing YouTube entirely when the
    # source is Spotify.
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      snapshot: false
  pluginsDir: "./plugins"

  server:
    # Must equal LAVALINK_PASSWORD in the bot's environment. The default is
    # Lavalink's published one: fine for a compose network or localhost, and
    # the bot logs a boot warning if you ship it anywhere reachable.
    password: ${LAVALINK_PASSWORD:youshallnotpass}

    sources:
      youtube: false # superseded by the plugin above — leave this false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true # lets /music play a direct audio URL the node can fetch
      local: false

    filters: # all on by default; volume is the one /music actually uses
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    bufferDurationMs: 400 # NAS buffer; higher survives longer GC pauses
    frameBufferDurationMs: 5000 # audio kept buffered ahead of playback
    opusEncodingQuality: 10 # 0–10, 10 = best quality, most CPU
    resamplingQuality: MEDIUM # LOW | MEDIUM | HIGH — HIGH costs real CPU
    # A track counts as stuck after this long without audio. 30 s instead of
    # the 10 s default: the bot skips ahead on TrackStuck, and a briefly
    # throttled YouTube stream is worth waiting for rather than losing.
    trackStuckThresholdMs: 30000
    useSeekGhosting: true # keep playing the buffer while a seek completes
    youtubePlaylistLoadLimit: 6 # playlist pages loaded per request (100 each)
    playerUpdateInterval: 1 # position updates to the bot, in seconds
    youtubeSearchEnabled: true
    soundcloudSearchEnabled: true
    gc-warnings: true

    # If YouTube starts answering 429 for the host's address, rotate over an
    # IPv6 block instead of fighting it (this is what the bot's
    # "YouTube refused" hint points at). Needs an actual IPv6 range on the
    # host — uncomment and fill in, then restart the node.
    #ratelimit:
    #  ipBlocks: ["2001:470:xxx:yyy::/64"]
    #  excludedIps: []
    #  strategy: "RotateOnBan" # RotateOnBan | LoadBalance | NanoSwitch | RotatingNanoSwitch
    #  searchTriggersFail: true
    #  retryLimit: -1 # -1 = lavaplayer default, 0 = retry forever

plugins:
  youtube:
    enabled: true
    allowSearch: true # "ytsearch:" / "ytmsearch:" — the bot's search path
    allowDirectVideoIds: true # a bare video id resolves, not just full URLs
    allowDirectPlaylistIds: true
    # Queried in order; the first client that returns usable audio wins, so a
    # throttled or sign-in-gated one costs a retry rather than a dead track.
    #
    # ANDROID_MUSIC and IOS don't need the player script (no signature cipher),
    # so they bypass the most common breakage: YouTube changing the script and
    # the cipher extractor failing to find the sig function. Put them first.
    # MWEB / WEB / WEBEMBEDDED do need the script and serve as fallbacks when
    # the mobile clients hit age-gated or login-gated videos.
    clients:
      - ANDROID_MUSIC
      - IOS
      - MWEB
      - WEB
      - WEBEMBEDDED

    # Only if YouTube insists you sign in to prove you are not a bot. Use a
    # burner account — this can get an account terminated. Set the log level
    # for dev.lavalink.youtube.http.YoutubeOauth2Handler to INFO (below) to
    # see the one-time refresh token printed on a successful flow.
    oauth:
      enabled: true
    #  refreshToken: ""

    # Alternative to OAuth: a Proof-of-Origin token from
    # https://github.com/iv-org/youtube-trusted-session-generator. Applies to
    # the WEB and WEBEMBEDDED clients only.
    #pot:
    #  token: ""
    #  visitorData: ""

  # LavaSrc — Spotify, Apple Music, Deezer etc.
  # Credentials come from the same env vars the bot uses (SPOTIFY_CLIENT_ID /
  # SPOTIFY_CLIENT_SECRET). Set them in your .env and restart.
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""   # ISRC match on YouTube (best quality)
      - "ytsearch:%QUERY%"      # YouTube text search fallback
      - "scsearch:%QUERY%"      # SoundCloud fallback
    sources:
      spotify: true
      applemusic: false
      deezer: false
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID:}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET:}"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/
  level:
    root: INFO
    lavalink: INFO
    # INFO here prints the OAuth flow hint if you ever enable it above.
    dev.lavalink.youtube: INFO
  logback:
    rollingpolicy:
      max-file-size: 25MB
      max-history: 7
      total-size-cap: 1GB
  request:
    enabled: true
    includeClientInfo: true
    includeHeaders: false
    includeQueryString: true
    # Off: every /loadtracks response carries full encoded track strings,
    # which is megabytes of noise for a debugging session. Flip to true when
    # you actually need to see what the bot sent.
    includePayload: false
    maxPayloadLength: 10000
