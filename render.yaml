# Optional companion deployment for the long-lived Discord gateway.
# Keep the dashboard on Vercel; deploy this worker to Render (or any worker
# host). Both services must use the same DISCORD_BOT_TOKEN.
#
# Music: /music works from here, but only against a Lavalink node this worker
# can reach — set LAVALINK_NODES below. The node owns the Discord voice socket
# and does the decoding, so it is the node that needs outbound UDP, not this
# container. Render's containers have no UDP egress, which means you cannot host
# the node on Render: run it on a VPS, a Fly.io machine, or your own machine
# (deploy/laptop-install.sh installs it as a systemd user service), then point
# LAVALINK_NODES at it, e.g. wss://music.example.com or ws://10.0.0.5:2333.
# A node with the default password must not sit on the public internet — give it
# a real LAVALINK_PASSWORD (set the same value here) or put TLS in front of it.
# With no reachable node the worker still boots and every other command works;
# /music replies that the music backend is down.
#
# Never run *this* service and a self-hosted worker at the same time on the same
# token: both process every message (double !burg relays, double prefix
# commands) and two MusicManagers fight over one guild's voice channel.
services:
  - type: worker
    name: monarch-bot
    runtime: docker
    dockerfilePath: ./docker/bot.Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: APP_URL
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      # Your own Discord user id (Developer Mode → right-click your name →
      # Copy User ID). Targeting it with /burg uno-reverses onto the invoker;
      # without it the owner can be burg'd like anyone else.
      - key: MONARCH_OWNER_USER_ID
        sync: false
      # Optional: set a server ID for immediate slash-command updates while
      # testing. Leave unset to register globally (global propagation can take
      # up to an hour in Discord).
      - key: DISCORD_GUILD_ID
        sync: false
      # Lavalink node(s) this worker plays through — see the header above.
      # Format: [name@][ws|wss|http|https://]host[:port], comma-separated.
      - key: LAVALINK_NODES
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: MUSIC_DJ_ROLE_NAMES
        value: dj
      - key: MUSIC_STAFF_ROLE_NAMES
        value: moderator,moderators,mod,mods,staff,admin,admins,administrator,administrators
